on:
  push:
    branches:
      - main
jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update
      - run: apt-get install -y buildah
      - run: |
          buildah build \
            --storage-driver=vfs \
            --isolation=chroot \
            --tag codeberg.org/${{ forgejo.repository }}:latest \
            -f Dockerfile-prod \
            .
      - run: |
          buildah push \
            --storage-driver=vfs \
            --creds ${{ forgejo.repository_owner }}:${{ secrets.REGISTRY_TOKEN }} \
            codeberg.org/${{ forgejo.repository }}:latest
